<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简历工坊 · 个人简历制作</title>
<link rel="stylesheet" href="style.css">
<!-- 简历样式单独内联，导出 HTML 时可直接复用 -->
<style id="resume-style">
/* ============ 简历基础 ============ */
.resume{--accent:#2563eb;--gap:10px;--fs:14px;background:#fff;color:#22252a;
  font-size:var(--fs);line-height:1.65;font-family:var(--rs-font,"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif);}
.resume *{box-sizing:border-box}
.rs-head{margin-bottom:calc(var(--gap) + 4px)}
.rs-avatar{width:64px;height:64px;object-fit:cover;flex:none}
.rs-name{font-size:26px;font-weight:700;margin:0;letter-spacing:1px;line-height:1.25}
.rs-title{color:var(--accent);font-size:13.5px;margin-top:3px;font-weight:600}
.rs-contacts{display:flex;flex-wrap:wrap;gap:3px 14px;margin-top:8px;font-size:12.5px;color:#555}
.rs-contact{display:inline-flex;align-items:center;gap:5px;max-width:100%}
.rs-contact svg{width:12px;height:12px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.75}
.rs-summary{margin-top:10px;font-size:13px;color:#444;white-space:pre-wrap}
.rs-body{margin-top:2px}
.rs-section{margin-bottom:calc(var(--gap) + 6px);break-inside:avoid}
.rs-sec-title{font-size:14px;font-weight:700;margin:0 0 8px;color:#111;letter-spacing:.5px}
.rs-item{margin-bottom:calc(var(--gap) + 1px);break-inside:avoid}
.rs-item-hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.rs-item-title{font-weight:600;font-size:13.5px}
.rs-item-date{font-size:12px;color:#777;white-space:nowrap;flex:none}
.rs-item-sub{font-size:12.5px;color:#555;margin-top:1px}
.rs-item-link{font-size:12px;color:var(--accent);word-break:break-all;margin-top:1px}
.rs-item-desc{margin-top:4px;font-size:13px;color:#333}
.rs-item-desc p{margin:0 0 2px}
.rs-item-desc ul{margin:2px 0 0;padding-left:17px}
.rs-item-desc li{margin-bottom:2px}
.rs-empty{color:#bbb;font-size:13px}

/* ============ 模板一：经典商务 ============ */
.tpl-classic .rs-head{border-bottom:2px solid var(--accent);padding-bottom:10px;display:flex;gap:16px;align-items:center}
.tpl-classic .rs-head-txt{flex:1;min-width:0}
.tpl-classic .rs-avatar{border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #e3e6ea}
.tpl-classic .rs-sec-title{border-bottom:1px solid #e2e5e9;padding-bottom:4px;margin-bottom:8px}
.tpl-classic .rs-item-title{color:#111}

/* ============ 模板二：现代双栏 ============ */
.tpl-modern{--side-w:58mm}
.tpl-modern .rs-head{background:var(--accent);color:#fff;margin:0;padding:12mm 15mm 10mm;display:flex;gap:16px;align-items:center}
.tpl-modern .rs-head{margin-left:-15mm;margin-right:-15mm;margin-top:-14mm}
.tpl-modern .rs-name{color:#fff}
.tpl-modern .rs-title{color:rgba(255,255,255,.9)}
.tpl-modern .rs-contacts{color:rgba(255,255,255,.92)}
.tpl-modern .rs-contact svg{opacity:.9}
.tpl-modern .rs-summary{color:rgba(255,255,255,.95)}
.tpl-modern .rs-avatar{border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.tpl-modern .rs-body{display:grid;grid-template-columns:var(--side-w) 1fr;gap:0 18px;margin-top:14px}
.tpl-modern .rs-col-side{border-right:1px solid #eceef1;padding-right:14px}
.tpl-modern .rs-sec-title{font-size:12.5px;letter-spacing:1px;color:var(--accent);text-transform:uppercase;
  border-bottom:1px solid #eceef1;padding-bottom:3px;margin-bottom:7px}
.tpl-modern .rs-section{margin-bottom:14px}
.tpl-modern .rs-item-date{display:block;color:#999;font-size:11.5px;margin-top:1px}

/* ============ 模板三：简约留白 ============ */
.tpl-minimal{--rs-font:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.8}
.tpl-minimal .rs-name{font-size:30px;font-weight:300;letter-spacing:3px}
.tpl-minimal .rs-title{font-weight:400;color:#666;font-size:13px;margin-top:6px}
.tpl-minimal .rs-head{border-bottom:1px solid #eee;padding-bottom:14px}
.tpl-minimal .rs-summary{margin-top:12px;color:#555}
.tpl-minimal .rs-sec-title{font-size:12px;color:#888;letter-spacing:2px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.tpl-minimal .rs-sec-title::before{content:"";width:5px;height:5px;background:var(--accent);border-radius:50%;flex:none}
.tpl-minimal .rs-section{margin-bottom:18px}
.tpl-minimal .rs-item{margin-bottom:14px}
.tpl-minimal .rs-item-title{font-weight:500}
.tpl-minimal .rs-item-date{color:#aaa}

/* ============ 模板四：学术经典 ============ */
.tpl-academic{--rs-font:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif;line-height:1.7}
.tpl-academic .rs-head{text-align:center;border-bottom:3px double #333;padding-bottom:10px}
.tpl-academic .rs-name{font-size:27px;letter-spacing:4px;font-weight:600}
.tpl-academic .rs-title{color:#444;font-weight:400;font-size:13px;margin-top:5px;letter-spacing:1px}
.tpl-academic .rs-contacts{justify-content:center;gap:3px 10px;color:#444}
.tpl-academic .rs-sep{color:#bbb}
.tpl-academic .rs-summary{text-align:justify;margin-top:12px;color:#333}
.tpl-academic .rs-sec-title{text-align:center;font-size:14px;letter-spacing:3px;margin:0 0 9px;padding-bottom:4px;border-bottom:1px solid #ddd}
.tpl-academic .rs-section{margin-bottom:15px}
.tpl-academic .rs-item-title{font-weight:600}
.tpl-academic .rs-item-date{font-style:italic;color:#666}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">简</span><b>简历工坊</b><em>本地离线 · 数据只存在你的浏览器</em></div>
  <div class="tb-actions">
    <button class="btn ghost" id="btn-sample">示例数据</button>
    <button class="btn ghost" id="btn-import">导入</button>
    <button class="btn ghost" id="btn-json">导出 JSON</button>
    <button class="btn ghost" id="btn-md">导出 Markdown</button>
    <button class="btn ghost" id="btn-html">导出 HTML</button>
    <button class="btn primary" id="btn-print">导出 PDF / 打印</button>
  </div>
</header>

<main class="app">
  <!-- 左：编辑区 -->
  <section class="pane editor-pane">
    <div class="pane-hd">
      <h2>内容编辑</h2>
      <button class="btn tiny" id="btn-reset">清空重来</button>
    </div>
    <div class="pane-bd" id="editor"></div>
  </section>

  <!-- 右：预览区 -->
  <section class="pane preview-pane">
    <div class="pane-hd preview-toolbar">
      <div class="tb-group">
        <label>模板</label>
        <select id="sel-tpl">
          <option value="classic">经典商务</option>
          <option value="modern">现代双栏</option>
          <option value="minimal">简约留白</option>
          <option value="academic">学术经典</option>
        </select>
      </div>
      <div class="tb-group">
        <label>主题色</label>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="sel-color" value="#2563eb">
      </div>
      <div class="tb-group">
        <label>字号</label>
        <input type="range" id="sel-fs" min="12" max="17" step="0.5" value="14">
        <span class="val" id="val-fs">14</span>
      </div>
      <div class="tb-group">
        <label>密度</label>
        <select id="sel-density">
          <option value="6">紧凑</option>
          <option value="10" selected>标准</option>
          <option value="15">宽松</option>
        </select>
      </div>
      <div class="tb-group">
        <label>字体</label>
        <select id="sel-font">
          <option value="sans">无衬线</option>
          <option value="serif">衬线</option>
        </select>
      </div>
      <div class="tb-group">
        <label>缩放</label>
        <input type="range" id="sel-zoom" min="50" max="130" step="5" value="100">
        <span class="val" id="val-zoom">100%</span>
      </div>
    </div>
    <div class="preview-scroll">
      <div class="preview-scale" id="preview-scale">
        <div class="page" id="page"></div>
      </div>
    </div>
  </section>
</main>

<input type="file" id="file-avatar" accept="image/*" hidden>
<input type="file" id="file-import" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
